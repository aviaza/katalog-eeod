<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzDfWZmfsc2XXfh61ZQo8vPurG8vmATNrqc0DnVkNN1WDmnbktSYZ6SeZHHNhCnJSM/exec";
    
    let currentUser = null;
    let masterData = [];
    let originalMasterDataBackup = [];
    let isMasterDataDirty = false;
    let catalogData = [];
    let usersListData = [];
    let pendingApprovals = [];
    let activeTab = 'generator';
    let selectedMasterCatId = null;
    let currentDecodedBaseDesc = "";

    // ==========================================
    // 1. AUTHENTICATION & NAVIGATION
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('appViews').classList.add('hidden');
        document.getElementById('sidebar').classList.add('!hidden'); 
        
        const savedSession = localStorage.getItem('pn_session_v12');
        if (savedSession) {
            currentUser = JSON.parse(savedSession);
            setupUserUI();
        } else {
            document.getElementById('authContainer').classList.remove('hidden');
        }
    });

    async function handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('loginUsername').value.trim();
        const p = document.getElementById('loginPassword').value.trim();
        showLoader("Verifikasi Akun...");
        try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "login", username: u, password: p }) });
            const result = await res.json();
            if (result.status === "success") {
                currentUser = result.user;
                localStorage.setItem('pn_session_v12', JSON.stringify(currentUser));
                setupUserUI();
            } else {
                const errDiv = document.getElementById('loginError');
                errDiv.textContent = result.message;
                errDiv.classList.remove('hidden');
            }
        } catch(err) { 
            alert("Error: " + err.message); 
        } finally { hideLoader(); }
    }

    function handleLogout() {
        if (isMasterDataDirty && !confirm("Ada perubahan Master Data yang belum disimpan. Yakin ingin keluar?")) return;
        currentUser = null;
        localStorage.removeItem('pn_session_v12');
        location.reload();
    }

    function setupUserUI() {
        document.getElementById('authContainer').classList.add('hidden');
        document.getElementById('appViews').classList.remove('hidden');
        document.getElementById('sidebar').classList.remove('!hidden');
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        document.getElementById('logoutBtn').style.display = 'flex';
        document.getElementById('userName').textContent = currentUser.name;
        document.getElementById('userRole').textContent = currentUser.role;
        
        if (['admin', 'superadmin'].includes(currentUser.role)) {
            document.getElementById('adminNavSection').classList.remove('hidden');
        }
        if (currentUser.role === 'superadmin') {
            const suNav = document.getElementById('superAdminNavSection');
            if(suNav) suNav.classList.remove('hidden');
        }

        fetchMasterFromCloud();
        switchTab('generator');
    }

    function switchTab(tab) {
        if ((!['admin','superadmin'].includes(currentUser.role)) && (tab === 'masterdata' || tab === 'approvals')) {
            alert('Akses ditolak!'); return;
        }
        activeTab = tab;
        ['generator', 'decoder', 'catalog', 'masterdata', 'approvals'].forEach(t => {
            const view = document.getElementById(`view-${t}`);
            const nav = document.getElementById(`nav-${t}`);
            if (view) view.classList.toggle('hidden', t !== tab);
            if (nav) {
                if (t === tab) nav.classList.add('sidebar-active', 'text-white');
                else nav.classList.remove('sidebar-active', 'text-white');
            }
        });

        if (tab === 'catalog') fetchCatalogFromCloud();
        if (tab === 'masterdata') renderMasterDataPanel();
        if (tab === 'approvals') fetchPendingApprovals();
    }

    function showLoader(txt) { 
        document.getElementById('loaderText').textContent=txt; 
        document.getElementById('globalLoader').classList.remove('hidden'); 
    }
    function hideLoader() { document.getElementById('globalLoader').classList.add('hidden'); }
    function setMasterDataDirty(dirty) {
        isMasterDataDirty = dirty;
        const badge = document.getElementById('masterDataUnsavedBadge');
        if (badge) badge.classList.toggle('hidden', !dirty);
    }
    function copyToClipboard(text, msg = "Tersalin!") {
        navigator.clipboard.writeText(text).then(() => alert(msg)).catch(e => alert("Gagal: " + e));
    }

    // ==========================================
    // 2. GENERATOR PART NUMBER
    // ==========================================
    async function fetchMasterFromCloud() {
        showLoader("Load Master Data...");
        try {
            const res = await fetch(`${API_URL}?action=getMasterData`);
            masterData = await res.json();
            originalMasterDataBackup = JSON.parse(JSON.stringify(masterData));
            initCategoryDropdowns();
        } catch(e) { console.error(e); } finally { hideLoader(); renderGeneratorForm(); }
    }

    function initCategoryDropdowns() {
        const select = document.getElementById('genCategorySelect');
        select.innerHTML = '<option value="">-- Pilih Kategori Produk --</option>';
        masterData.forEach(cat => {
            select.innerHTML += `<option value="${cat.id}">[${cat.prefix}] ${cat.name}</option>`;
        });
    }

    function renderGeneratorForm() {
        const catId = document.getElementById('genCategorySelect').value;
        const container = document.getElementById('dynamicSegContainer');
        const extraContainer = document.getElementById('extraDescContainer');
        const extraInput = document.getElementById('genExtraDesc');
        container.innerHTML = '';
        if(extraInput) extraInput.value = '';

        if (!catId) {
            container.innerHTML = `<div class="text-center py-10 px-4 bg-slate-50/50 rounded-2xl border border-dashed text-slate-400">Pilih Kategori Produk di atas</div>`;
            if(extraContainer) extraContainer.classList.add('hidden');
            updateGeneratedPnDisplay();
            return;
        }

        const category = masterData.find(c => c.id === catId);
        if(extraContainer) extraContainer.classList.toggle('hidden', !category.enableExtraDesc);

        category.segments.forEach((seg, idx) => {
            const segDiv = document.createElement('div');
            segDiv.className = "p-4 bg-slate-50/80 border rounded-xl space-y-2.5";
            segDiv.innerHTML = `
                <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                    <span><span class="w-4 h-4 bg-slate-200 rounded-full inline-flex items-center justify-center text-[10px] mr-1">${idx + 1}</span> ${seg.name} (${seg.length} digit)</span>
                    ${seg.allowCustom ? '<span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md">Bisa Custom Input</span>' : ''}
                </div>
                <select id="gen_seg_${seg.id}" onchange="handleSegmentChange('${catId}', ${idx})" class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500 font-mono font-semibold"></select>
                <input type="text" id="gen_custom_${seg.id}" maxlength="${seg.length}" placeholder="Atau ketik custom..." class="hidden w-full mt-2 px-3 py-2 border rounded-xl text-xs font-mono uppercase bg-blue-50 focus:ring-2 focus:ring-blue-500 font-bold" oninput="this.value=this.value.toUpperCase(); updateGeneratedPnDisplay();">
            `;
            container.appendChild(segDiv);
        });

        populateSegmentOptions(catId, 0);
    }

    function populateSegmentOptions(catId, segIndex) {
        const category = masterData.find(c => c.id === catId);
        if (!category || segIndex >= category.segments.length) return;
        const seg = category.segments[segIndex];
        const select = document.getElementById(`gen_seg_${seg.id}`);
        if (!select) return;

        let allowedCodes = null;

        // EVALUASI ATURAN KETERKAITAN (COMPOSITE KEY)
        if (segIndex > 0) {
            for (let pIdx = 0; pIdx < segIndex; pIdx++) {
                const parentSeg = category.segments[pIdx];
                const parentSelect = document.getElementById(`gen_seg_${parentSeg.id}`);
                const parentVal = parentSelect ? parentSelect.value.toUpperCase() : null;

                if (parentVal && category.conditionalRules) {
                    const ruleKey = `${parentSeg.id}_${parentVal}`; // Contoh: s4_01
                    if (Array.isArray(category.conditionalRules[ruleKey])) {
                        // Ambil aturan hanya untuk segmen yang sedang di-evaluate
                        const rulesForThisSeg = category.conditionalRules[ruleKey].filter(k => k.startsWith(`${seg.id}_`));
                        
                        if (rulesForThisSeg.length > 0) {
                            const rawCodes = rulesForThisSeg.map(k => k.replace(`${seg.id}_`, ''));
                            if (allowedCodes === null) allowedCodes = [...rawCodes];
                            else allowedCodes = allowedCodes.filter(c => rawCodes.includes(c));
                        }
                    }
                }
            }
        }

        select.innerHTML = '<option value="">-- Pilih --</option>';
        seg.options.forEach(opt => {
            const upperCode = opt.code ? opt.code.toUpperCase() : "";
            if (allowedCodes === null || allowedCodes.includes(upperCode)) {
                select.innerHTML += `<option value="${upperCode}">[${upperCode}] ${opt.label}</option>`;
            }
        });

        if (seg.allowCustom) {
            select.innerHTML += `<option value="__CUSTOM__">-- ISI CUSTOM VALUE --</option>`;
        }
        if (select.options.length > 1) select.selectedIndex = 1;

        handleSegmentChange(catId, segIndex);
    }

    function handleSegmentChange(catId, segIndex) {
        const category = masterData.find(c => c.id === catId);
        const seg = category.segments[segIndex];
        const select = document.getElementById(`gen_seg_${seg.id}`);
        const customInput = document.getElementById(`gen_custom_${seg.id}`);

        if (seg.allowCustom && customInput) {
            customInput.classList.toggle('hidden', select.value !== "__CUSTOM__");
            if(select.value !== "__CUSTOM__") customInput.value = '';
        }

        if (segIndex + 1 < category.segments.length) populateSegmentOptions(catId, segIndex + 1);
        else updateGeneratedPnDisplay();
    }

    function resolveDescTemplate(category, selectedCodeMap) {
        if (category.descRules && category.descRules.length > 0) {
            for (let rule of category.descRules) {
                if (selectedCodeMap[rule.segmentId] && selectedCodeMap[rule.segmentId].toUpperCase() === rule.triggerCode.toUpperCase()) {
                    return rule.template;
                }
            }
        }
        return category.descTemplate;
    }

    function cleanDescriptionString(str) {
        return str.replace(/,\s*,/g, ',').replace(/,\s*$/g, '').replace(/^\s*,\s*/g, '').replace(/\s+/g, ' ').trim();
    }

    function updateGeneratedPnDisplay() {
        const catId = document.getElementById('genCategorySelect').value;
        const pnDisplay = document.getElementById('genPnDisplay');
        const pnLength = document.getElementById('genPnLength');
        const descDisplay = document.getElementById('genDescDisplay');

        if (!catId) {
            pnDisplay.textContent = "--------------------";
            if(pnLength) pnLength.textContent = "0 / 20";
            descDisplay.textContent = "Deskripsi otomatis...";
            return;
        }

        const category = masterData.find(c => c.id === catId);
        let rawPn = "";
        let descValues = {};
        let selectedCodeMap = {};

        category.segments.forEach(seg => {
            const select = document.getElementById(`gen_seg_${seg.id}`);
            const customInput = document.getElementById(`gen_custom_${seg.id}`);
            let codeVal = "", labelVal = "";

            if (select) {
                if (select.value === "__CUSTOM__" && customInput) {
                    let userVal = customInput.value.trim().toUpperCase();
                    if (userVal) {
                        codeVal = /^\d+$/.test(userVal) ? userVal.padStart(seg.length, '0').slice(-seg.length) : userVal.padEnd(seg.length, '0').slice(0, seg.length);
                        labelVal = userVal;
                    } else {
                        codeVal = "-".repeat(seg.length);
                        labelVal = "...";
                    }
                    selectedCodeMap[seg.id] = codeVal;
                } else if (select.value) {
                    codeVal = select.value.toUpperCase();
                    selectedCodeMap[seg.id] = codeVal;
                    const matchedOpt = seg.options.find(o => o.code.toUpperCase() === select.value.toUpperCase());
                    labelVal = (matchedOpt && matchedOpt.showInDesc === false) ? "" : (matchedOpt ? (matchedOpt.desc || matchedOpt.label) : select.value);
                } else {
                    codeVal = "-".repeat(seg.length);
                    labelVal = "...";
                    selectedCodeMap[seg.id] = "";
                }
            }
            rawPn += codeVal;
            descValues[seg.name] = labelVal;
        });

        const finalPn = rawPn.slice(0, 20).toUpperCase();
        pnDisplay.textContent = finalPn;
        if(pnLength) pnLength.textContent = `${finalPn.length} / 20`;

        let activeTemplate = resolveDescTemplate(category, selectedCodeMap);
        let descStr = activeTemplate;
        Object.keys(descValues).forEach(key => {
            descStr = descStr.replace(new RegExp(`\\{${key}\\}`, 'g'), descValues[key]);
        });

        let finalMainDesc = cleanDescriptionString(descStr);
        const extraInput = document.getElementById('genExtraDesc');
        if (category.enableExtraDesc && extraInput && extraInput.value.trim()) {
            finalMainDesc += "\n\n[Keterangan Tambahan]:\n" + extraInput.value.trim();
        }
        descDisplay.textContent = finalMainDesc;
    }

    async function saveToCatalog() {
        const catId = document.getElementById('genCategorySelect').value;
        if (!catId) return alert('Pilih kategori!');
        const pn = document.getElementById('genPnDisplay').textContent.trim();
        if (pn.includes('-')) return alert('Lengkapi semua segmen digit!');

        const category = masterData.find(c => c.id === catId);
        const extraInput = document.getElementById('genExtraDesc');
        const extraText = extraInput ? extraInput.value.trim() : "";

        if (category.enableExtraDesc && category.extraDescRequired && !extraText) {
            return alert('Kategori ini mewajibkan Deskripsi Tambahan!');
        }

        let mainDesc = document.getElementById('genDescDisplay').textContent.trim();
        if (extraText && mainDesc.includes("[Keterangan Tambahan]:")) {
            mainDesc = mainDesc.split("[Keterangan Tambahan]:")[0].trim();
        }

        const proj = document.getElementById('catProject').value.trim() || 'GENERAL';
        const dateInput = document.getElementById('catDate').value;
        
        const newItem = {
            id: "item_" + Date.now(),
            pn: pn,
            categoryName: category.name,
            description: mainDesc,
            extraDescription: extraText,
            project: proj,
            stock: document.getElementById('catStock').value || 1,
            location: document.getElementById('catLocation').value || '',
            date: dateInput ? dateInput : new Date().toISOString().split('T')[0]
        };

        showLoader("Menyimpan ke Sheets...");
        try {
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "addCatalogItem", requesterUsername: currentUser.username, data: newItem }) });
            alert("Berhasil disimpan!");
            switchTab('catalog');
        } catch(e) { alert("Error: "+e); } finally { hideLoader(); }
    }

    // ==========================================
    // 3. CATALOG, APPROVAL, EXPORT, PRINT
    // ==========================================
    async function fetchCatalogFromCloud() {
        showLoader("Load Katalog...");
        try {
            const res = await fetch(`${API_URL}?action=getCatalogData`);
            catalogData = await res.json();
            renderCatalogTable();
        } catch(e) {} finally { hideLoader(); }
    }

    function renderCatalogTable() {
        const tbody = document.getElementById('catalogTableBody');
        const search = document.getElementById('catalogSearch').value.toLowerCase();
        tbody.innerHTML = '';
        
        catalogData.filter(i => (i.pn||"").toLowerCase().includes(search) || (i.project||"").toLowerCase().includes(search))
        .forEach(item => {
            const canDirectEdit = currentUser.username === item.creator || ['admin','superadmin'].includes(currentUser.role);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="p-3 font-mono font-bold">${item.pn}</td>
                <td class="p-3">${item.categoryName}</td>
                <td class="p-3 text-[11px]">${item.description}</td>
                <td class="p-3">${item.project}</td>
                <td class="p-3">${item.stock}</td>
                <td class="p-3 text-[10px] text-blue-600 font-bold">${item.creator || 'admin'}</td>
                <td class="p-3 text-center no-print">
                    <button onclick="openEditCatalogModal('${item.id}')" class="text-${canDirectEdit ? 'blue' : 'amber'}-600 px-2 text-lg" title="${canDirectEdit ? 'Edit Data' : 'Request Edit'}"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button onclick="requestDeleteCatalog('${item.id}')" class="text-red-600 px-2 text-lg"><i class="fa-solid fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function openEditCatalogModal(id) {
        const item = catalogData.find(i => i.id === id);
        document.getElementById('editCatId').value = item.id;
        document.getElementById('editCatPn').value = item.pn;
        document.getElementById('editCatDesc').value = item.description;
        document.getElementById('editCatProject').value = item.project;
        
        const isOwner = currentUser.username === item.creator || ['admin','superadmin'].includes(currentUser.role);
        document.getElementById('editModalWarning').classList.toggle('hidden', isOwner);
        document.getElementById('btnSaveEdit').textContent = isOwner ? 'Simpan Langsung' : 'Kirim Request Approval';
        
        document.getElementById('editCatalogModal').classList.remove('hidden');
    }

    function closeEditCatalogModal() { document.getElementById('editCatalogModal').classList.add('hidden'); }

    async function saveCatalogEditSubmit() {
        const id = document.getElementById('editCatId').value;
        const item = catalogData.find(i => i.id === id);
        const newData = { id: id, description: document.getElementById('editCatDesc').value, project: document.getElementById('editCatProject').value };
        
        const isOwner = currentUser.username === item.creator || ['admin','superadmin'].includes(currentUser.role);
        
        showLoader("Memproses...");
        try {
            if (isOwner) {
                await fetch(API_URL, { method:'POST', body: JSON.stringify({ action: "updateCatalogItem", requesterUsername: currentUser.username, data: newData }) });
                alert("Berhasil diperbarui langsung!");
            } else {
                await fetch(API_URL, { method:'POST', body: JSON.stringify({ action: "requestApproval", requesterUsername: currentUser.username, data: { type: "EDIT", catalogId: id, targetData: newData } }) });
                alert("Request Edit berhasil dikirim ke Admin!");
            }
            closeEditCatalogModal();
            fetchCatalogFromCloud();
        } catch(e) {} finally { hideLoader(); }
    }

    async function requestDeleteCatalog(id) {
        const item = catalogData.find(i => i.id === id);
        const isOwner = currentUser.username === item.creator || ['admin','superadmin'].includes(currentUser.role);
        
        if(confirm(`Yakin ingin menghapus ${item.pn}?`)) {
            showLoader("Memproses...");
            if (isOwner) {
                await fetch(API_URL, { method:'POST', body: JSON.stringify({ action: "deleteCatalogItem", requesterUsername: currentUser.username, id: id }) });
            } else {
                await fetch(API_URL, { method:'POST', body: JSON.stringify({ action: "requestApproval", requesterUsername: currentUser.username, data: { type: "DELETE", catalogId: id, targetData: {} } }) });
                alert("Request Hapus dikirim ke Admin!");
            }
            hideLoader();
            fetchCatalogFromCloud();
        }
    }

    async function fetchPendingApprovals() {
        showLoader("Cek Request...");
        const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action: "getPendingApprovals", requesterUsername: currentUser.username }) });
        pendingApprovals = await res.json();
        hideLoader();
        
        const tbody = document.getElementById('approvalsTableBody');
        tbody.innerHTML = '';
        if (pendingApprovals.length === 0) tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4">Tidak ada request pending.</td></tr>`;
        
        pendingApprovals.forEach(req => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="p-3 font-bold text-blue-700">${req.requester}</td>
                <td class="p-3 font-bold ${req.type==='DELETE'?'text-red-600':'text-amber-600'}">${req.type}</td>
                <td class="p-3 text-[10px] break-all">${JSON.stringify(req.targetData)}</td>
                <td class="p-3 text-center">
                    <button onclick="resolveApprove('${req.reqId}', 'APPROVED')" class="bg-emerald-600 text-white px-2 py-1 rounded text-[10px] m-1">Approve</button>
                    <button onclick="resolveApprove('${req.reqId}', 'REJECTED')" class="bg-red-600 text-white px-2 py-1 rounded text-[10px] m-1">Reject</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function resolveApprove(reqId, status) {
        showLoader("Memproses...");
        await fetch(API_URL, { method:'POST', body: JSON.stringify({ action: "resolveApproval", requesterUsername: currentUser.username, reqId: reqId, resolution: status }) });
        hideLoader();
        fetchPendingApprovals();
    }

    function openPrintSetupModal() {
        document.getElementById('printSetupModal').classList.remove('hidden');
    }

    function executePrint() {
        document.getElementById('printSetupModal').classList.add('hidden');
        document.getElementById('pHeaderTitle').textContent = document.getElementById('setupPrintTitle').value;
        document.getElementById('pHeaderSub').textContent = document.getElementById('setupPrintSub').value;
        
        const d = new Date();
        document.getElementById('pFooterText').innerHTML = `<b>${document.getElementById('setupPrintFooter').value}</b><br>Dicetak oleh: ${currentUser.name} | Tanggal: ${d.toLocaleDateString()} ${d.toLocaleTimeString()}`;
        
        const tableHTML = document.getElementById('catalogTable').outerHTML;
        document.getElementById('printTableContainer').innerHTML = tableHTML;
        window.print();
    }

    function exportExcel() {
        let table = document.getElementById("catalogTable");
        let html = table.outerHTML;
        let blob = new Blob(['\ufeff', html], { type: 'application/vnd.ms-excel' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = `Catalog_Export_${Date.now()}.xls`;
        a.click();
    }

    // ==========================================
    // 4. MASTER DATA (ADMIN) - PERBAIKAN BUG #5 & #6
    // ==========================================
    function renderMasterDataPanel() {
        const listContainer = document.getElementById('masterCatList');
        listContainer.innerHTML = '';

        masterData.forEach(cat => {
            const btn = document.createElement('button');
            btn.onclick = () => selectMasterCategory(cat.id);
            btn.className = `w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold flex justify-between transition ${selectedMasterCatId === cat.id ? 'bg-blue-50 border-blue-300 text-blue-700 border' : 'hover:bg-slate-100 text-slate-700'}`;
            btn.innerHTML = `<span>[${cat.prefix}] ${cat.name}</span><i class="fa-solid fa-chevron-right text-[10px] text-slate-400 mt-1"></i>`;
            listContainer.appendChild(btn);
        });

        if (!selectedMasterCatId && masterData.length > 0) selectMasterCategory(masterData[0].id);
        else if (selectedMasterCatId) renderMasterEditorForm(selectedMasterCatId);
    }

    function selectMasterCategory(catId) {
        selectedMasterCatId = catId;
        renderMasterDataPanel();
    }

    function renderMasterEditorForm(catId) {
        const panel = document.getElementById('masterEditorPanel');
        const cat = masterData.find(c => c.id === catId);
        if (!cat) return;

        panel.innerHTML = `
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-bold text-slate-800 text-base">Edit: ${cat.name}</h3>
                <div>
                    <button onclick="deleteMasterCategory('${cat.id}')" class="bg-red-100 text-red-700 text-xs px-3 py-1.5 rounded-lg"><i class="fa-solid fa-trash"></i> Hapus</button>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4 text-xs mb-4">
                <div><label class="block font-bold mb-1">Nama Kategori</label><input type="text" id="mCatName" value="${cat.name}" onchange="updateMasterHeader('${cat.id}')" class="w-full border rounded-lg px-3 py-2 outline-none"></div>
                <div><label class="block font-bold mb-1">Prefix (4 Digit)</label><input type="text" id="mCatPrefix" maxlength="4" value="${cat.prefix.toUpperCase()}" oninput="this.value = this.value.toUpperCase()" onchange="updateMasterHeader('${cat.id}')" class="w-full border rounded-lg px-3 py-2 font-mono outline-none"></div>
            </div>

            <div class="space-y-3 bg-slate-50 p-4 rounded-xl border mb-4">
                <label class="block text-xs font-bold mb-1">Template Deskripsi</label>
                <input type="text" id="mCatDescTemplate" value="${cat.descTemplate}" onchange="updateMasterHeader('${cat.id}')" class="w-full border rounded-lg px-3 py-2 text-xs font-mono outline-none">
            </div>

            <!-- SEGMEN -->
            <div class="space-y-3 border-t pt-4 mb-4">
                <div class="flex justify-between items-center"><h4 class="text-xs font-bold uppercase">Struktur Segmen Digit</h4><button onclick="addMasterSegment('${cat.id}')" class="text-blue-600 text-xs font-bold">+ Segmen</button></div>
                <div id="mSegmentsContainer" class="space-y-4"></div>
            </div>

            <!-- ATURAN KETERKAITAN (BUG FIXED) -->
            <div class="space-y-3 border-t pt-4">
                <h4 class="text-xs font-bold uppercase">Aturan Keterkaitan Opsi</h4>
                <div id="mConditionalRulesContainer" class="p-4 bg-slate-50 border rounded-xl text-xs space-y-3"></div>
            </div>
        `;
        renderMasterSegments(cat);
        renderConditionalRulesMapping(cat);
    }

    function updateMasterHeader(catId) {
        const cat = masterData.find(c => c.id === catId);
        cat.name = document.getElementById('mCatName').value;
        cat.prefix = document.getElementById('mCatPrefix').value.toUpperCase();
        cat.descTemplate = document.getElementById('mCatDescTemplate').value;
        if (cat.segments.length > 0) cat.segments[0].options = [{ code: cat.prefix, label: cat.name, showInDesc: true }];
        setMasterDataDirty(true); initCategoryDropdowns(); renderMasterDataPanel();
    }

    // --- MANAJEMEN SEGMEN ---
    function renderMasterSegments(cat) {
        const container = document.getElementById('mSegmentsContainer');
        container.innerHTML = '';
        cat.segments.forEach((seg, sIdx) => {
            const segBox = document.createElement('div');
            segBox.className = "border bg-white p-3 rounded-xl space-y-2";
            segBox.innerHTML = `
                <div class="flex items-center justify-between border-b pb-1">
                    <span class="font-bold text-xs">Segmen ${sIdx + 1}</span>
                    <div>
                        <label class="text-[10px] mr-2"><input type="checkbox" ${seg.allowCustom?'checked':''} onchange="updateSegProp('${cat.id}',${sIdx},'allowCustom',this.checked)"> Custom Input</label>
                        ${sIdx > 0 ? `<button onclick="removeMasterSegment('${cat.id}',${sIdx})" class="text-red-500"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <input type="text" value="${seg.name}" onchange="updateSegProp('${cat.id}',${sIdx},'name',this.value)" class="border rounded px-2 py-1" placeholder="Nama Segmen">
                    <input type="number" value="${seg.length}" onchange="updateSegProp('${cat.id}',${sIdx},'length',parseInt(this.value))" class="border rounded px-2 py-1" placeholder="Panjang Digit">
                </div>
                <div class="text-[10px] font-bold text-slate-500 mt-2 flex justify-between">
                    <span>Opsi Pilihan</span> ${sIdx > 0 ? `<button onclick="addSegOption('${cat.id}',${sIdx})" class="text-blue-500">+ Tambah Opsi</button>` : ''}
                </div>
                <div id="seg_opts_${sIdx}" class="space-y-1"></div>
            `;
            container.appendChild(segBox);

            const optsContainer = segBox.querySelector(`#seg_opts_${sIdx}`);
            seg.options.forEach((opt, oIdx) => {
                optsContainer.innerHTML += `
                    <div class="flex gap-1 items-center text-xs">
                        <input type="text" value="${opt.code}" onchange="updateSegOpt('${cat.id}',${sIdx},${oIdx},'code',this.value.toUpperCase())" class="w-16 font-mono border rounded px-1 py-1 uppercase" ${sIdx===0?'readonly':''}>
                        <input type="text" value="${opt.label}" onchange="updateSegOpt('${cat.id}',${sIdx},${oIdx},'label',this.value)" class="flex-1 border rounded px-1 py-1" placeholder="Label">
                        <input type="text" value="${opt.desc||''}" onchange="updateSegOpt('${cat.id}',${sIdx},${oIdx},'desc',this.value)" class="flex-1 border rounded px-1 py-1 bg-amber-50" placeholder="Deskripsi">
                        ${sIdx > 0 ? `<button onclick="removeSegOpt('${cat.id}',${sIdx},${oIdx})" class="text-red-500 px-1"><i class="fa-solid fa-x"></i></button>` : ''}
                    </div>
                `;
            });
        });
    }

    function addMasterSegment(catId) {
        const cat = masterData.find(c => c.id === catId);
        cat.segments.push({ id: "s" + (cat.segments.length + 1), name: "Baru", length: 2, allowCustom: false, options: [{code:"01", label:"Opsi 1"}] });
        setMasterDataDirty(true); renderMasterEditorForm(catId);
    }
    function removeMasterSegment(catId, sIdx) {
        masterData.find(c => c.id === catId).segments.splice(sIdx, 1);
        setMasterDataDirty(true); renderMasterEditorForm(catId);
    }
    function updateSegProp(catId, sIdx, prop, val) {
        masterData.find(c => c.id === catId).segments[sIdx][prop] = val;
        setMasterDataDirty(true);
    }
    function addSegOption(catId, sIdx) {
        const cat = masterData.find(c => c.id === catId);
        cat.segments[sIdx].options.push({code:"XX", label:"Baru"});
        setMasterDataDirty(true); renderMasterEditorForm(catId);
    }
    function updateSegOpt(catId, sIdx, oIdx, field, val) {
        masterData.find(c => c.id === catId).segments[sIdx].options[oIdx][field] = val;
        setMasterDataDirty(true);
    }
    function removeSegOpt(catId, sIdx, oIdx) {
        masterData.find(c => c.id === catId).segments[sIdx].options.splice(oIdx, 1);
        setMasterDataDirty(true); renderMasterEditorForm(catId);
    }
    
    // --- CONDITIONAL RULES MAPPING (FIX COMPOSITE KEY & SELECT ALL) ---
    function renderConditionalRulesMapping(cat) {
        const container = document.getElementById('mConditionalRulesContainer');
        if (cat.segments.length < 2) {
            container.innerHTML = `<div class="italic text-slate-400">Minimal butuh 2 segmen.</div>`; return;
        }

        let pIdx = parseInt(container.getAttribute('data-p') || 0);
        let cIdx = parseInt(container.getAttribute('data-c') || 1);
        if (pIdx >= cat.segments.length) pIdx = 0;
        if (cIdx >= cat.segments.length || cIdx <= pIdx) cIdx = pIdx + 1;
        
        container.setAttribute('data-p', pIdx); container.setAttribute('data-c', cIdx);
        const pSeg = cat.segments[pIdx]; const cSeg = cat.segments[cIdx];

        let pOpts = cat.segments.map((s,i) => `<option value="${i}" ${i===pIdx?'selected':''}>Seg ${i+1}: ${s.name}</option>`).join('');
        let cOpts = cat.segments.map((s,i) => `<option value="${i}" ${i===cIdx?'selected':''} ${i<=pIdx?'disabled':''}>Seg ${i+1}: ${s.name}</option>`).join('');

        container.innerHTML = `
            <div class="grid grid-cols-2 gap-2 mb-2">
                <select id="selPSeg" onchange="changeRulePair('${cat.id}')" class="border p-1 text-xs font-bold">${pOpts}</select>
                <select id="selCSeg" onchange="changeRulePair('${cat.id}')" class="border p-1 text-xs font-bold">${cOpts}</select>
            </div>
            <div id="rulesList" class="space-y-2 mt-2"></div>
        `;

        const rulesList = container.querySelector('#rulesList');
        if(!cat.conditionalRules) cat.conditionalRules = {};

        pSeg.options.forEach(opt => {
            const pCode = opt.code.toUpperCase();
            const pKey = `${pSeg.id}_${pCode}`; // KUNCI COMPOSITE BARU (e.g., s4_01)
            
            let allowedChildKeys = cat.conditionalRules[pKey] || null;

            const card = document.createElement('div');
            card.className = "bg-white p-2 border rounded text-xs";
            
            // TOMBOL CHECK ALL / UNCHECK ALL
            const header = document.createElement('div');
            header.className = "flex justify-between items-center border-b pb-1 mb-1 font-bold";
            header.innerHTML = `
                <span>Jika Induk: [${pCode}] ${opt.label}</span>
                <div class="space-x-2">
                    <button onclick="toggleAllRules('${cat.id}', '${pSeg.id}', '${pCode}', '${cSeg.id}', true)" class="text-blue-600 text-[10px] bg-blue-50 px-1 rounded">Centang Semua</button>
                    <button onclick="toggleAllRules('${cat.id}', '${pSeg.id}', '${pCode}', '${cSeg.id}', false)" class="text-red-600 text-[10px] bg-red-50 px-1 rounded">Kosongkan Semua</button>
                </div>
            `;
            card.appendChild(header);

            const boxes = document.createElement('div');
            boxes.className = "flex flex-wrap gap-2";
            cSeg.options.forEach(cOpt => {
                const cCode = cOpt.code.toUpperCase();
                const cKey = `${cSeg.id}_${cCode}`; // KUNCI COMPOSITE BARU
                const isChecked = allowedChildKeys === null || allowedChildKeys.includes(cKey);
                
                boxes.innerHTML += `
                    <label class="bg-slate-50 px-1.5 py-0.5 border rounded cursor-pointer hover:bg-slate-100 flex items-center gap-1">
                        <input type="checkbox" ${isChecked?'checked':''} onchange="toggleRule('${cat.id}', '${pSeg.id}', '${pCode}', '${cSeg.id}', '${cCode}', this.checked)">
                        <span class="font-mono">${cCode}</span>
                    </label>
                `;
            });
            card.appendChild(boxes);
            rulesList.appendChild(card);
        });
    }

    function changeRulePair(catId) {
        document.getElementById('mConditionalRulesContainer').setAttribute('data-p', document.getElementById('selPSeg').value);
        document.getElementById('mConditionalRulesContainer').setAttribute('data-c', document.getElementById('selCSeg').value);
        renderConditionalRulesMapping(masterData.find(c => c.id === catId));
    }

    function toggleRule(catId, pSegId, pCode, cSegId, cCode, isChecked) {
        const cat = masterData.find(c => c.id === catId);
        const pKey = `${pSegId}_${pCode}`;
        const cKey = `${cSegId}_${cCode}`;
        
        if(!cat.conditionalRules) cat.conditionalRules = {};
        
        // Jika belum ada array, buat array dari SEMUA opsi child yang ada saat ini
        if(!Array.isArray(cat.conditionalRules[pKey])) {
            const childSeg = cat.segments.find(s => s.id === cSegId);
            cat.conditionalRules[pKey] = childSeg.options.map(o => `${cSegId}_${o.code.toUpperCase()}`);
        }

        if(isChecked) {
            if(!cat.conditionalRules[pKey].includes(cKey)) cat.conditionalRules[pKey].push(cKey);
        } else {
            cat.conditionalRules[pKey] = cat.conditionalRules[pKey].filter(k => k !== cKey);
        }
        setMasterDataDirty(true);
    }

    function toggleAllRules(catId, pSegId, pCode, cSegId, isChecked) {
        const cat = masterData.find(c => c.id === catId);
        const childSeg = cat.segments.find(s => s.id === cSegId);
        
        childSeg.options.forEach(cOpt => {
            toggleRule(catId, pSegId, pCode, cSegId, cOpt.code.toUpperCase(), isChecked);
        });
        
        renderConditionalRulesMapping(cat); // Render ulang UI Checkbox
    }

    function createNewCategory() {
        const newId = "cat_" + Date.now();
        masterData.push({
            id: newId, prefix: "NEW1", name: "Baru", enableExtraDesc: true, descTemplate: "{Type}",
            segments: [
                { id: "s1", name: "Prefix", length: 4, allowCustom: false, options: [{code: "NEW1", label: "Baru", showInDesc: true}] },
                { id: "s2", name: "Tipe", length: 2, allowCustom: false, options: [{code: "01", label: "Opsi 1"}] }
            ],
            conditionalRules: {}
        });
        setMasterDataDirty(true); initCategoryDropdowns(); selectMasterCategory(newId);
    }
    
    function deleteMasterCategory(catId) {
        if(confirm('Hapus kategori ini?')) {
            masterData = masterData.filter(c => c.id !== catId);
            selectedMasterCatId = null; setMasterDataDirty(true); initCategoryDropdowns(); renderMasterDataPanel();
        }
    }

    async function saveAllMasterToCloud() {
        showLoader("Menyimpan Master Data...");
        try {
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "saveMasterData", requesterUsername: currentUser.username, data: masterData }) });
            alert("Master Data berhasil disimpan!");
            originalMasterDataBackup = JSON.parse(JSON.stringify(masterData));
            setMasterDataDirty(false);
        } catch(e) { alert("Error: "+e); } finally { hideLoader(); }
    }
</script>
